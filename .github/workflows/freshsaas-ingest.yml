name: FreshSAAS hourly launch ingest

# Vercel's Hobby plan caps cron jobs at once per day, so the hourly schedule
# lives here instead and just calls the ingest endpoint.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Lets the job ask GitHub for a signed identity token. The API verifies it
# against GitHub's public keys and checks it came from this repository, so no
# shared secret has to be stored anywhere for the schedule to work.
permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INGEST_URL: ${{ vars.INGEST_URL || 'https://freshsaas.online/api/cron/ingest' }}
        run: |
          set -euo pipefail

          # Prefer the shared secret when one is configured; otherwise mint a
          # short-lived OIDC token, which needs no prior setup.
          if [ -n "${CRON_SECRET:-}" ]; then
            echo "Authenticating with CRON_SECRET."
            credential="$CRON_SECRET"
          else
            echo "No CRON_SECRET set; authenticating with a GitHub OIDC token."
            credential=$(curl -sS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=freshsaas-cron" \
              | jq -r '.value')

            if [ -z "$credential" ] || [ "$credential" = "null" ]; then
              echo "Could not obtain an OIDC token from GitHub." >&2
              exit 1
            fi
          fi

          response=$(curl -sS -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $credential" \
            -w '\n%{http_code}' \
            --max-time 120)

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "$body"

          if [ "$status" != "200" ]; then
            echo "Ingest failed with HTTP $status" >&2
            exit 1
          fi
