name: roofsignal

on:
  push:
    paths: ['roofsignal/**', '.github/workflows/roofsignal-ci.yml']
  pull_request:
    paths: ['roofsignal/**', '.github/workflows/roofsignal-ci.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roofsignal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: roofsignal/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
