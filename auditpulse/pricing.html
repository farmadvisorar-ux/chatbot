    <meta name="twitter:title" content="Pricing — AuditPulse">
    <meta name="twitter:description" content="Start free with 10 sites and weekly re-audits. Scale up to daily scans, enterprise automation, and elite penetration testing.">
    <meta name="twitter:image" content="https://brokehealth.com/og-image.png">
    <link rel="canonical" href="https://brokehealth.com/pricing.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
    <style>
        .pricing-hero {
            text-align: center;
            padding: 80px var(--s-12) 60px;
        }
        .pricing-hero h1 {
            font-family: 'Syne', sans-serif;
            font-size: var(--t-3xl);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: var(--s-4);
            color: var(--ink);
        }
        .pricing-hero p {
            font-size: var(--t-lg);
            color: var(--ink-2);
            max-width: 50ch;
            margin: 0 auto;
        }
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--s-8);
            padding: var(--s-10) var(--s-6);
            max-width: 1400px;
            margin: 0 auto;
        }
        .tier-card {
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: var(--r-2xl);
            padding: var(--s-8);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.2s;
        }
        .tier-card:hover {
            border-color: var(--accent);
            box-shadow: 0 12px 40px rgba(53,224,161,.08);
        }
        .tier-card.featured {
            background: var(--surface-3);
            border: 2px solid var(--accent);
            transform: scale(1.02);
            box-shadow: 0 20px 60px rgba(53,224,161,.12);
        }
        .tier-badge {
            position: absolute;
            top: -12px;
            right: var(--s-6);
            background: var(--accent);
            color: var(--accent-ink);
            padding: var(--s-2) var(--s-4);
            border-radius: var(--r-md);
            font-size: var(--t-sm);
            font-weight: 700;
        }
        .tier-name {
            font-family: 'Syne', sans-serif;
            font-size: var(--t-xl);
            font-weight: 800;
            color: var(--ink);
            margin-bottom: var(--s-2);
        }
        .tier-price {
            font-size: var(--t-3xl);
            font-weight: 800;
            color: var(--accent);
            margin-bottom: var(--s-2);
        }
        .tier-price small {
            font-size: var(--t-base);
            color: var(--muted);
            font-weight: 400;
        }
        .tier-desc {
            font-size: var(--t-sm);
            color: var(--ink-2);
            margin-bottom: var(--s-6);
            min-height: 40px;
        }
        .tier-features {
            list-style: none;
            margin: var(--s-6) 0;
            flex: 1;
        }
        .tier-features li {
            padding: var(--s-3) 0;
            font-size: var(--t-sm);
            color: var(--ink-2);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: flex-start;
            gap: var(--s-3);
        }
        .tier-features li:last-child {
            border-bottom: none;
        }
        .tier-features li::before {
            content: "✓";
            flex-shrink: 0;
            color: var(--accent);
            font-weight: 700;
        }
        .tier-cta {
            display: block;
            width: 100%;
            background: var(--accent);
            color: var(--accent-ink);
            border: none;
            padding: var(--s-4) var(--s-6);
            border-radius: var(--r-md);
            font-size: var(--t-base);
            font-weight: 600;
            font-family: inherit;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            margin-top: auto;
            transition: all 0.2s;
        }
        .tier-cta:hover {
            background: #22c98c;
        }
        .tier-cta.coming {
            background: var(--surface-2);
            color: var(--muted);
            border: 1px dashed var(--line-strong);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header class="topbar wrap">
        <a class="brand" href="/"><img class="brand-mark" src="/mark.svg" alt="" width="30" height="30"> AuditPulse</a>
        <div id="header-controls" data-auth-controls></div>
    </header>

    <main>
        <section class="pricing-hero wrap">
            <h1>Simple, transparent pricing</h1>
            <p>Start free. Scale as your security needs grow. All plans include automatic scanning and detailed reports.</p>
        </section>

        <section class="pricing-grid" id="pricing-container">
            <!-- Loaded dynamically from /api/tiers -->
        </section>
    </main>

    <script type="module" src="./src/pricing.ts"></script>
</body>
</html>
