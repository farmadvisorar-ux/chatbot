<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security audit report — AuditPulse</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Shared reports are the most-forwarded link in the product, so they need
         preview tags. noindex keeps them out of search results; it does not stop
         a messaging app from rendering a card. Deliberately generic — the page is
         a static shell and the findings load client-side from the share token, so
         nothing about the audited site can leak into a preview.
         og:url is deliberately omitted: every real report URL carries its own
         ?token=, and a static og:url would make preview cards link to a
         tokenless page that renders nothing. With it absent, scrapers fall back
         to the URL that was actually shared, token intact. -->
    <meta property="og:title" content="Security audit report — AuditPulse">
    <meta property="og:description" content="A full security audit: severity-ranked findings, explained in plain English, with the fixes.">
    <meta property="og:image" content="https://brokehealth.com/og-image.png">
    <meta property="og:image:secure_url" content="https://brokehealth.com/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="AuditPulse security report showing a graded audit with severity breakdown">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AuditPulse">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Security audit report — AuditPulse">
    <meta name="twitter:description" content="A full security audit: severity-ranked findings, explained in plain English, with the fixes.">
    <meta name="twitter:image" content="https://brokehealth.com/og-image.png">
    <meta name="twitter:image:alt" content="AuditPulse security report showing a graded audit with severity breakdown">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
    <div class="pulse-line" role="presentation" aria-hidden="true"></div>
    <header class="topbar wrap">
        <a class="brand" href="/"><img class="brand-mark" src="/mark.svg" alt="" width="30" height="30"> AuditPulse</a>
    </header>

    <main class="wrap-narrow" style="padding:24px 0 80px">
        <div id="report-root">
            <div class="card center"><span class="spinner"></span></div>
        </div>
    </main>

    <script type="module" src="./src/report.ts"></script>
</body>
</html>
