<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brandG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Glow Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgG)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#brandG)" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Radar Pulse Accent Arc -->
  <path d="M 46 16 A 22 22 0 0 1 54 26" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
  <path d="M 40 20 A 15 15 0 0 1 47 28" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- "I" Pillar -->
  <rect x="14" y="20" width="7" height="24" rx="3.5" fill="url(#brandG)" filter="url(#glow)"/>
  <circle cx="17.5" cy="14" r="3" fill="#38bdf8" filter="url(#glow)"/>

  <!-- "Q" Ring -->
  <circle cx="38" cy="32" r="11" fill="none" stroke="url(#brandG)" stroke-width="6" stroke-linecap="round"/>

  <!-- "Q" Ascending Radar Tail (Emerald Financial Surge) -->
  <path d="M 43 37 L 52 46" stroke="url(#accentG)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="51.5" cy="45.5" r="2" fill="#34d399"/>
</svg>
