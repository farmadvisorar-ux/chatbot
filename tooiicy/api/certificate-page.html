<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooiicy First Addition Trading Card</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        .card {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 3px solid #ffd700;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.3), 0 0 20px rgba(0, 0, 0, 0.8);
            color: #fff;
        }
        .header {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .skull {
            font-size: 60px;
            margin: 20px 0;
        }
        .edition-badge {
            display: inline-block;
            background: #ffd700;
            color: #000;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 18px;
            margin: 20px 0;
            letter-spacing: 1px;
        }
        .rarity {
            font-size: 12px;
            color: #ff69b4;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .details {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid #ffd700;
            border-radius: 4px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            font-size: 14px;
        }
        .detail-row:last-child {
            border-bottom: none;
        }
        .label {
            color: #aaa;
            font-weight: bold;
        }
        .value {
            color: #ffd700;
            text-align: right;
        }
        .certificate-id {
            font-size: 11px;
            color: #666;
            margin-top: 20px;
            word-break: break-all;
            font-family: monospace;
            padding: 10px;
            background: #000;
            border-radius: 4px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #ffd700;
            padding-top: 20px;
        }
        .print-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
        }
        .print-btn:hover {
            background: #ffed4e;
        }
        .loading {
            color: #aaa;
            text-align: center;
            padding: 40px;
        }
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
        }
        @media print {
            body { background: white; }
            .card { box-shadow: none; }
            .print-btn { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="loading">Loading your certificate...</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div class="error">
                        No certificate token provided. Please check your order confirmation email.
                    </div>
                </div>
            `;
        } else {
            fetch(`/api/certificate?token=${encodeURIComponent(token)}`)
                .then(r => r.json())
                .then(cert => {
                    if (!cert.edition) throw new Error(cert.error || 'Certificate not found');

                    const rareColor = cert.rarity === 'Ultra Rare' ? '#ff69b4' : '#ffd700';

                    document.getElementById('content').innerHTML = `
                        <div class="card">
                            <div class="header">TOOIICY</div>
                            <div class="subtitle">First Addition Trading Card</div>
                            <div class="skull">💀</div>
                            <div class="edition-badge">EDITION #${String(cert.edition).padStart(3, '0')}</div>
                            <div class="rarity">${cert.rarity} — ${cert.status}</div>

                            <div class="details">
                                <div class="detail-row">
                                    <span class="label">PRODUCT</span>
                                    <span class="value">${cert.product}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label">OWNER</span>
                                    <span class="value">${cert.owner}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label">QUANTITY</span>
                                    <span class="value">${cert.quantity}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label">VARIATION</span>
                                    <span class="value">${cert.variation}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="label">DATE ISSUED</span>
                                    <span class="value">${cert.datePaid}</span>
                                </div>
                            </div>

                            <div class="certificate-id">
                                Certificate ID: ${cert.certificateId}
                            </div>

                            <button class="print-btn" onclick="window.print()">🖨️ Print Certificate</button>

                            <div class="footer">
                                This is a limited edition first addition certificate of authenticity.<br>
                                Only 200 ever issued. Keep it safe—it's a collector's item.
                            </div>
                        </div>
                    `;
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = `
                        <div class="card">
                            <div class="error">
                                ❌ ${err.message}<br><br>
                                If you believe this is an error, check your order confirmation email for the correct certificate link.
                            </div>
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
